<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOZRY - Projects Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0D1117;
        --card: #161B22;
        --border: #30363D;
        --text: #C9D1D9;
        --text-muted: #8B949E;
        --primary: #238636;
        --accent: #1F6FEB;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 20px 0;
    }
    .phone-frame {
        width: 390px;
        height: 844px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 24px;
        overflow-y: auto;
        overflow-x: hidden;
    }
    .header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: var(--text-muted);
    }
    .container { padding: 0 16px 80px 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 16px; }
    h2 { font-size: 18px; font-weight: 600; margin: 24px 0 12px 0; }

    /* Top 3 Cards */
    .top-cards {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 8px;
    }
    .top-card {
        min-width: 140px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        cursor: pointer;
    }
    .top-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .progress-bar { height: 4px; background: #21262D; border-radius: 2px; }
    .progress { height: 100%; background: var(--primary); border-radius: 2px; }

    /* My Projects Hub */
    .hub-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }
    .hub-item {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
    }
    .hub-item:hover { border-color: var(--accent); }
    .hub-icon {
        width: 48px; height: 48px;
        background: #21262D;
        border-radius: 8px;
        margin: 0 auto 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px;
    }
    .hub-item p { font-size: 12px; font-weight: 500; }

    /* Templates */
    .template-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    .template-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        height: 120px;
        background-size: cover;
        background-position: center;
        cursor: pointer;
    }

    /* Bottom Nav */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        width: 390px;
        background: var(--card);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-around;
        padding: 8px 0;
    }
    .nav-item {
        display: flex; flex-direction: column; align-items: center;
        font-size: 10px; color: var(--text-muted); cursor: pointer;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="header">
        <span>9:41</span>
        <span>📶 🔋</span>
    </div>

    <div class="container">
        <h1>Projects Hub</h1>

        <!-- Top Cards -->
        <div class="top-cards">
            <div class="top-card" onclick="openProject('Calculator App')">
                <h3>Calculator App</h3>
                <div class="progress-bar"><div class="progress" style="width: 0%"></div></div>
            </div>
            <div class="top-card" onclick="openProject('Todo list')">
                <h3>Todo list</h3>
                <div class="progress-bar"><div class="progress" style="width: 100%"></div></div>
            </div>
            <div class="top-card" onclick="openProject('Portfolio Site')">
                <h3>Portfolio Site</h3>
                <div class="progress-bar"><div class="progress" style="width: 40%"></div></div>
            </div>
        </div>

        <!-- My Projects Hub -->
        <h2>My Projects Hub</h2>
        <div class="hub-grid">
            <div class="hub-item" onclick="goTo('Guided Projects')">
                <div class="hub-icon">📂</div><p>Guided Projects</p>
            </div>
            <div class="hub-item" onclick="goTo('Blank Canvas')">
                <div class="hub-icon">📄</div><p>Blank Canvas</p>
            </div>
            <div class="hub-item" onclick="goTo('Challenge projects')">
                <div class="hub-icon">⚡</div><p>Challenge projects</p>
            </div>
        </div>

        <!-- Project Templates -->
        <h2>Project Templates</h2>
        <div class="template-grid">
            <div class="template-card" style="background-image: url('https://placehold.co/200x120/161B22/C9D1D9?text=Landing+Page')" onclick="selectTemplate(1)"></div>
            <div class="template-card" style="background-image: url('https://placehold.co/200x120/161B22/C9D1D9?text=Dashboard')" onclick="selectTemplate(2)"></div>
            <div class="template-card" style="background-image: url('https://placehold.co/200x120/161B22/C9D1D9?text=Portfolio')" onclick="selectTemplate(3)"></div>
            <div class="template-card" style="background-image: url('https://placehold.co/200x120/161B22/C9D1D9?text=E-commerce')" onclick="selectTemplate(4)"></div>
            <div class="template-card" style="background-image: url('https://placehold.co/200x120/161B22/C9D1D9?text=Blog')" onclick="selectTemplate(5)"></div>
            <div class="template-card" style="background-image: url('https://placehold.co/200x120/161B22/C9D1D9?text=App+UI')" onclick="selectTemplate(6)"></div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="setActive(this)">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home
        </div>
        <div class="nav-item" onclick="setActive(this)">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>Learn
        </div>
        <div class="nav-item" onclick="setActive(this)">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>Challenges
        </div>
        <div class="nav-item" onclick="setActive(this)">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19 5v2h-4V5c0-1.1-.9-2-2-2S11 3.9 11 5v2H7V5c0-2.76 2.24-5 5-5s5 2.24 5 5zM5 21h14c1.1 0 2-.9 2-2v-9H3v9c0 1.1.9 2 2 2z"/></svg>Leaderboard
        </div>
        <div class="nav-item" onclick="setActive(this)">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Profile
        </div>
    </div>
</div>

<script>
    function openProject(name) {
        alert("Opening: " + name + "\n\nYou can change this to: window.location.href = 'project-details.html'");
    }
    function goTo(page) {
        alert("Go to: " + page + " page");
    }
    function selectTemplate(id) {
        alert("Selected Template ID: " + id);
    }
    function setActive(el) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
