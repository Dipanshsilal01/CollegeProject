<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 1 - ATOZRY</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#080e1a;
  color:white;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:402px;
  min-height:897px;
  background:#080e1a;
  position:relative;
  overflow:hidden;
}

/* STATUS BAR */
.status-bar{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 43px 0 47px;
}

.time{
  font-size:16px;
  font-weight:600;
  color:#b9bdc5;
}

.dynamic-island{
  width:125px;
  height:38px;
  background:#000;
  border-radius:30px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:35px;
}

.status-icons{
  color:#dce1e8;
  font-size:17px;
  letter-spacing:2px;
}

/* HEADER */
.header{
  padding:12px 30px 0 45px;
  position:relative;
}

.back{
  position:absolute;
  left:12px;
  top:15px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#162131;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d9e1ea;
  font-size:21px;
  cursor:pointer;
}

.header h1{
  font-size:24px;
  font-weight:700;
  margin-bottom:3px;
}

.header p{
  font-size:12px;
  color:#e6e6e6;
}

.py{
  position:absolute;
  right:32px;
  top:4px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#164052;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00d5d6;
  font-size:11px;
}

/* BASICS CARD */
.basics-card{
  margin:31px 30px 0 21px;
  width:351px;
  height:110px;
  background:#111926;
  border-radius:30px;
  padding:17px 18px;
}

.basics-card h2{
  font-size:15px;
  font-weight:800;
}

.basics-card .description{
  margin-top:12px;
  text-align:center;
  font-size:11px;
  font-weight:500;
}

.tags{
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:10px;
}

.tag{
  height:21px;
  border-radius:30px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7px;
}

.time-tag{
  background:#080e1a;
  color:white;
}

.xp-tag{
  background:#162d49;
  color:#35a7ff;
  gap:3px;
}

.completed{
  background:#2c274e;
  color:#c300ff;
  font-weight:700;
}

.language{
  background:#202c40;
  height:31px;
  border-radius:50px;
  padding:0 12px 0 7px;
  display:flex;
  align-items:center;
  gap:5px;
  margin-left:auto;
}

.js-circle{
  width:23px;
  height:23px;
  border-radius:50%;
  background:#8a75c9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
}

.language span{
  font-size:10px;
}

/* PROGRESS */
.progress-section{
  margin-top:28px;
  padding:0 12px;
  display:flex;
  align-items:center;
}

.progress{
  width:290px;
  height:10px;
  background:#0f1523;
  border-radius:45px;
}

.hearts{
  margin-left:8px;
  display:flex;
  gap:1px;
  font-size:15px;
}

/* QUESTION NUMBER */
.question-number{
  font-size:10px;
  margin:38px 0 21px 27px;
}

/* QUIZ */
.quiz-card{
  width:365px;
  height:303px;
  margin-left:17px;
  background:#111926;
  border-radius:45px;
  padding:25px 18px;
}

.question{
  font-size:16px;
  font-weight:500;
  line-height:22px;
  margin-left:5px;
  margin-bottom:10px;
}

.option{
  width:327px;
  height:38px;
  background:#0f1523;
  border:none;
  border-radius:40px;
  color:white;
  font-size:14px;
  font-weight:500;
  text-align:left;
  padding-left:24px;
  margin-bottom:17px;
  cursor:pointer;
  transition:.2s;
}

.option:hover{
  background:#162d49;
}

.option.selected{
  background:#1d4266;
  outline:1px solid #35a7ff;
}

/* BUTTON */
.check-answer{
  width:361px;
  height:60px;
  border:none;
  border-radius:30px;
  background:#0f1523;
  color:white;
  font-size:16px;
  font-weight:500;
  margin:26px 0 0 21px;
  cursor:pointer;
}

.check-answer:hover{
  background:#162d49;
}

.skip{
  display:block;
  text-align:center;
  color:white;
  font-size:12px;
  text-decoration:none;
  margin-top:13px;
}

/* NAVIGATION */
.bottom-nav{
  position:absolute;
  bottom:23px;
  left:1px;
  width:400px;
  height:64px;
  background:#121826;
  border-radius:30px;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  width:65px;
  text-align:center;
  color:white;
  text-decoration:none;
  font-size:11px;
}

.nav-icon{
  display:block;
  font-size:20px;
  height:25px;
  color:#8c99ab;
}

.nav-item.active,
.nav-item.active .nav-icon{
  color:#35a7ff;
}

.nav-item.learn{
  color:#8c99ab;
}

@media(max-width:402px){
  .app{
    transform-origin:top center;
  }

  .basics-card,
  .quiz-card,
  .check-answer,
  .bottom-nav{
    max-width:calc(100% - 30px);
  }

  .basics-card{
    width:calc(100% - 42px);
  }

  .quiz-card{
    width:calc(100% - 34px);
    height:auto;
  }

  .option{
    width:100%;
  }

  .check-answer{
    width:calc(100% - 42px);
  }

  .bottom-nav{
    width:calc(100% - 2px);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="status-bar">
    <div class="time">9:41</div>
    <div class="dynamic-island"></div>
    <div class="status-icons">▮▮▮ ◒ ▰</div>
  </div>

  <div class="header">
    <div class="back" onclick="goBack()">‹</div>

    <h1>Lesson 1</h1>
    <p>Python : 9 lessons total</p>

    <div class="py">Py</div>
  </div>

  <div class="basics-card">
    <h2>Basics</h2>

    <div class="description">
      Syntax, structure, and your first program.
    </div>

    <div class="tags">

      <div class="tag time-tag">
        15 min
      </div>

      <div class="tag xp-tag">
        ⚡ +50 XP
      </div>

      <div class="tag completed">
        Completed
      </div>

      <div class="language">
        <div class="js-circle">JS</div>
        <span>JavaScript</span>
      </div>

    </div>
  </div>

  <div class="progress-section">

    <div class="progress"></div>

    <div class="hearts">
      ❤️ ❤️ ❤️ ❤️ ❤️
    </div>

  </div>

  <div class="question-number">
    Question 1 of 3
  </div>

  <div class="quiz-card">

    <div class="question">
      Which statement prints text to the screen<br>
      in Python?
    </div>

    <button class="option" onclick="selectOption(this, false)">
      console.log("Hi")
    </button>

    <button class="option" onclick="selectOption(this, true)">
      print("Hi")
    </button>

    <button class="option" onclick="selectOption(this, false)">
      System.out.println("Hi")
    </button>

    <button class="option" onclick="selectOption(this, false)">
      printf("Hi")
    </button>

  </div>

  <button class="check-answer" onclick="checkAnswer()">
    Check answer
  </button>

  <a href="#" class="skip" onclick="skipLesson()">
    Skip to lesson 2
  </a>

  <div class="bottom-nav">

    <a href="index.html" class="nav-item active">
      <span class="nav-icon">⌂</span>
      Home
    </a>

    <a href="#" class="nav-item learn">
      <span class="nav-icon">▱</span>
      Learn
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon">⚔</span>
      Challenges
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon">♜</span>
      Leaderboard
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon">♙</span>
      Profile
    </a>

  </div>

</div>

<script>

let selectedAnswer = null;
let correctAnswer = false;

function selectOption(element, isCorrect){

  document.querySelectorAll(".option").forEach(option=>{
    option.classList.remove("selected");
  });

  element.classList.add("selected");

  selectedAnswer = element;
  correctAnswer = isCorrect;
}

function checkAnswer(){

  if(!selectedAnswer){
    alert("Please select an answer first!");
    return;
  }

  if(correctAnswer){
    selectedAnswer.style.background="#1c5137";
    alert("Correct! 🎉");
  }else{
    selectedAnswer.style.background="#5a252d";
    alert("Incorrect. Try again!");
  }
}

function skipLesson(){
  alert("Moving to Lesson 2...");
}

function goBack(){
  window.history.back();
}

</script>

</body>
</html>
