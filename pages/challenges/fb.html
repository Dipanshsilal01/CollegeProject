<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FizzBuzz - ATOZRY</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: #080e1a;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 402px;
    min-height: 897px;
    background: #080e1a;
    position: relative;
    overflow: hidden;
    padding-bottom: 100px;
}

/* STATUS BAR */

.status-bar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 43px 0 47px;
}

.time {
    font-size: 16px;
    font-weight: 600;
    color: #c7cbd2;
}

.dynamic-island {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 125px;
    height: 38px;
    background: #000;
    border-radius: 30px;
}

.status-icons {
    font-size: 16px;
    letter-spacing: 2px;
    color: #dce1e8;
}

/* HEADER */

.header {
    height: 80px;
    position: relative;
    padding: 7px 45px;
}

.header h1 {
    font-size: 24px;
    font-weight: 700;
}

.back {
    position: absolute;
    left: 12px;
    top: 17px;
    width: 23px;
    height: 23px;
    border: none;
    border-radius: 50%;
    background: #162131;
    color: white;
    cursor: pointer;
    font-size: 20px;
    line-height: 20px;
}

.challenge-logo {
    position: absolute;
    right: 27px;
    top: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #2c274e;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a878ff;
    font-size: 17px;
}

/* DAILY CHALLENGE CARD */

.challenge-card {
    width: 351px;
    height: 181px;
    margin: 1px auto 0;
    position: relative;
    background: #111926;
    border: 1px solid #9734f6;
    border-radius: 30px;
    padding: 24px 16px;
}

.daily-title {
    color: #9734f6;
    font-size: 12px;
    font-weight: 700;
}

.challenge-description {
    position: absolute;
    top: 65px;
    left: 22px;
    right: 22px;
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    line-height: 15px;
}

/* TAGS */

.tags {
    position: absolute;
    bottom: 19px;
    left: 12px;
    display: flex;
    gap: 11px;
}

.tag {
    height: 21px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
}

.easy-tag {
    width: 54px;
    background: #080e1a;
    color: white;
}

.xp-tag {
    width: 54px;
    background: #162d49;
    color: #9734f6;
    gap: 3px;
}

/* PROGRESS */

.progress-area {
    margin-top: 15px;
    padding-left: 13px;
    display: flex;
    align-items: center;
}

.progress-bar {
    width: 290px;
    height: 10px;
    background: #0f1523;
    border-radius: 45px;
}

.hearts {
    display: flex;
    gap: 2px;
    margin-left: 5px;
    font-size: 14px;
}

.question-number {
    margin: 5px 0 11px 23px;
    font-size: 10px;
    font-weight: 500;
}

/* QUIZ */

.quiz-card {
    width: 365px;
    height: 303px;
    margin: 0 auto;
    background: #111926;
    border-radius: 45px;
    padding: 29px 18px;
}

.question {
    font-size: 16px;
    font-weight: 500;
    text-align: center;
    margin-bottom: 26px;
}

/* OPTIONS */

.option {
    width: 327px;
    height: 38px;
    display: block;
    margin: 0 auto 17px;
    padding-left: 24px;
    border: none;
    border-radius: 40px;
    background: #0f1523;
    color: white;
    text-align: left;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #162d49;
}

.option.selected {
    background: #183b5a;
    outline: 1px solid #35a7ff;
}

.option.correct {
    background: #1c5137;
    outline: 1px solid #3ddc84;
}

.option.wrong {
    background: #5a252d;
    outline: 1px solid #ff5c6c;
}

/* CHECK ANSWER */

.check-answer {
    width: 361px;
    height: 45px;
    display: block;
    margin: 26px auto 0;
    border: none;
    border-radius: 30px;
    background: #0f1523;
    color: white;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
}

.check-answer:hover {
    background: #162131;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
    position: absolute;
    bottom: 24px;
    left: 1px;
    width: 400px;
    max-width: calc(100% - 2px);
    height: 64px;
    background: #121826;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: space-around;
}

.nav-item {
    width: 70px;
    color: white;
    text-align: center;
    text-decoration: none;
    font-size: 11px;
}

.nav-icon {
    display: block;
    height: 25px;
    font-size: 20px;
    color: #8c99ab;
}

.nav-item.active {
    color: #35a7ff;
}

.nav-item.active .nav-icon {
    color: #35a7ff;
}

/* MOBILE */

@media (max-width: 380px) {

    .challenge-card {
        width: calc(100% - 40px);
    }

    .quiz-card {
        width: calc(100% - 34px);
        padding-left: 15px;
        padding-right: 15px;
    }

    .option {
        width: 100%;
    }

    .check-answer {
        width: calc(100% - 42px);
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- STATUS BAR -->

    <div class="status-bar">
        <div class="time">9:41</div>

        <div class="dynamic-island"></div>

        <div class="status-icons">
            ▮▮▮ ◔ ▰
        </div>
    </div>


    <!-- HEADER -->

    <div class="header">

        <button class="back" onclick="goBack()">
            ‹
        </button>

        <h1>FizzBuzz</h1>

        <div class="challenge-logo">
            ⚔
        </div>

    </div>


    <!-- DAILY CHALLENGE -->

    <div class="challenge-card">

        <div class="daily-title">
            DAILY CHALLENGE
        </div>

        <div class="challenge-description">
            Print numbers 1...n, replacing multiples of 3 with Fizz,<br>
            multiples of 5 with Buzz, and multiples of both with<br>
            FizzBuzz.
        </div>

        <div class="tags">

            <div class="tag easy-tag">
                Easy
            </div>

            <div class="tag xp-tag">
                ⚡ +50 XP
            </div>

        </div>

    </div>


    <!-- PROGRESS -->

    <div class="progress-area">

        <div class="progress-bar"></div>

        <div class="hearts">
            ❤️ ❤️ ❤️ ❤️ ❤️
        </div>

    </div>


    <div class="question-number">
        Question 1 of 2
    </div>


    <!-- QUIZ -->

    <div class="quiz-card">

        <div class="question">
            What should be printed for 15?
        </div>

        <button class="option" onclick="selectOption(this, false)">
            Fizz
        </button>

        <button class="option" onclick="selectOption(this, false)">
            Buzz
        </button>

        <button class="option" onclick="selectOption(this, true)">
            Fizzbuzz
        </button>

        <button class="option" onclick="selectOption(this, false)">
            15
        </button>

    </div>


    <!-- CHECK ANSWER -->

    <button class="check-answer" onclick="checkAnswer()">
        Check answer
    </button>


    <!-- BOTTOM NAVIGATION -->

    <div class="bottom-nav">

        <a href="index.html" class="nav-item active">
            <span class="nav-icon">⌂</span>
            Home
        </a>

        <a href="#" class="nav-item">
            <span class="nav-icon">▱</span>
            Learn
        </a>

        <a href="challenges.html" class="nav-item">
            <span class="nav-icon">⚔</span>
            Challenges
        </a>

        <a href="#" class="nav-item">
            <span class="nav-icon">♜</span>
            Leaderboard
        </a>

        <a href="#" class="nav-item">
            <span class="nav-icon">♙</span>
            Profile
        </a>

    </div>

</div>


<script>

let selectedAnswer = null;
let correctAnswer = false;

function selectOption(element, isCorrect) {

    document.querySelectorAll(".option").forEach(function(option) {
        option.classList.remove("selected");
        option.classList.remove("correct");
        option.classList.remove("wrong");
    });

    element.classList.add("selected");

    selectedAnswer = element;
    correctAnswer = isCorrect;
}

function checkAnswer() {

    if (!selectedAnswer) {
        alert("Please select an answer first!");
        return;
    }

    document.querySelectorAll(".option").forEach(function(option) {
        option.classList.remove("correct");
        option.classList.remove("wrong");
    });

    if (correctAnswer) {

        selectedAnswer.classList.add("correct");

        alert("Correct! 🎉 +50 XP");

    } else {

        selectedAnswer.classList.add("wrong");

        alert("Incorrect. Try again!");
    }
}

function goBack() {
    window.history.back();
}

</script>

</body>
</html>
